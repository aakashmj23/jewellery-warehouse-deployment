apiVersion: apps/v1
kind: Deployment
metadata:
  name: jewellery-frontend
  namespace: jewellery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jewellery-frontend
  template:
    metadata:
      labels:
        app: jewellery-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/aakashmj23/jewellery-frontend:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
                