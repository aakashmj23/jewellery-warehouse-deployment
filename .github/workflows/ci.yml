
name: Jewellery Warehouse CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  project-check:
    name: Basic project validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Display runner information
        run: |
          echo "GitHub Actions runner is working"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"

      - name: Check project files
        run: |
          test -f docker-compose.yml
          test -f ecom-project/pom.xml
          test -f jewellery-ui/package.json
          echo "Required project files found"

  backend-ci:
    name: Build and test backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: aakash
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ecom-project/pom.xml

      - name: Build and test backend
        working-directory: ecom-project
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/aakash
        run: ./mvnw --batch-mode verify
        
  frontend-ci:
    name: Build and test frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jewellery-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: jewellery-ui
        run: npm ci

      - name: Lint frontend
        working-directory: jewellery-ui
        run: npm run lint

      - name: Build frontend
        working-directory: jewellery-ui
        run: npm run build
  publish-images:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    needs:
      - project-check
      - backend-ci
      - frontend-ci

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ecom-project/pom.xml

      - name: Build backend JAR
        working-directory: ecom-project
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/aakash
        run: ./mvnw --batch-mode package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./ecom-project
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jewellery-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./jewellery-ui
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jewellery-frontend:latest