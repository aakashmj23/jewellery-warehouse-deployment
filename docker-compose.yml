
services:
  backend:
    build:
      context: ./ecom-project
      dockerfile: Dockerfile
    image: jewellery-backend:day1
    container_name: backend
    restart: always
    networks:
      - existing-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./jewellery-ui
      dockerfile: Dockerfile
    image: jewellery-frontend:day2
    container_name: frontend
    restart: always
    networks:
      - existing-network
    depends_on:
      - backend
    ports:
      - "5173:80"

networks:
  existing-network:
    external: true
    name: docker_default